<article class="work-card tone-{{ include.item.tone | default: 'peach' }}">
  <div class="card-top"><span class="eyebrow">{{ include.item.category | escape }}</span><span class="card-number" aria-hidden="true">{{ include.item.number | default: '↗' }}</span></div>
  {% if include.item.image %}<img class="project-thumb" src="{{ include.item.image | relative_url }}" alt="{{ include.item.image_alt | default: include.item.title | escape }}" loading="lazy" width="640" height="360">{% endif %}
  <h3><a href="{{ include.item.url | relative_url }}">{{ include.item.title | escape }}</a></h3>
  <p>{{ include.item.summary | escape }}</p>
  <div class="card-bottom">
    {% if include.item.example %}<span class="example-tag">Draft example</span>{% else %}<span class="card-meta">{{ include.item.status | escape }}</span>{% endif %}
    <span class="card-arrow" aria-hidden="true">↗</span>
  </div>
</article>
