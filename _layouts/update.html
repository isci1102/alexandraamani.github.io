---
layout: default
---
<article class="page-content shell">
  <a class="text-link back-link" href="{{ '/updates/' | relative_url }}">← All updates</a>
  <header class="page-header"><p class="eyebrow"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%d %B %Y' }}</time></p><h1>{{ page.title | escape }}</h1><p class="page-description">{{ page.summary | escape }}</p></header>
  {% if page.example %}<aside class="example-notice"><strong>Example update.</strong> Replace or delete this sample before launch.</aside>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
